services:
  - type: web
    name: ayursatya-inference
    runtime: python
    buildCommand: python --version && pip install -r inference-service/requirements.txt && python inference-service/download_artifacts.py
    startCommand: python --version && gunicorn --chdir inference-service --workers 1 --timeout 180 --bind 0.0.0.0:$PORT app:app
    # Keep deployment health checks lightweight. Model validation remains
    # available through /ready without preventing the web process from
    # becoming routable while EfficientNet initializes.
    healthCheckPath: /health
    envVars:
      - key: INFERENCE_SERVICE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: INFERENCE_ARTIFACTS_DIR
        value: /opt/render/project/src/ml/artifacts
      - key: HF_MODEL_REPO_ID
        value: shubh1206/ayursatya-model
      - key: HF_TOKEN
        sync: false
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: TORCH_INTEROP_THREADS
        value: "1"
      - key: TORCH_MKLDNN
        value: "0"
      - key: TORCH_DTYPE
        value: "float16"
      - key: ENABLE_GRADCAM
        value: "0"
