services:
  - type: web
    name: ayursatya-inference
    runtime: python
    buildCommand: pip install -r inference-service/requirements.txt
    startCommand: gunicorn --chdir inference-service --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: INFERENCE_SERVICE_API_KEY
        sync: false
      - key: INFERENCE_ARTIFACTS_DIR
        sync: false
